{% layout none %}

<!DOCTYPE html>
<html lang="en">
  <head>
    {{ content_for_header }}

    <!-- Base path so the React app finds images in Assets -->
    <base href="https://www.broadstrokeinc.com/" />

    <meta charset="UTF-8" />
    <title>Wide Format Printing Services — Large Format Graphics, Vehicle Wraps & Signage — Broadstroke, Inc.</title>
    <meta name="description" content="One-stop wide format printing solutions in Wichita KS: large format graphics, vehicle wraps, custom signage & banners with concierge service, professional installation, and seamless integration with commercial printing, automated mailing via Postalocity, and promotional products." />

    <!-- Canonical + Sitemap -->
    <link rel="canonical" href="{{ canonical_url }}" />
    <link rel="sitemap" type="application/xml" href="https://broadstrokeinc.com/wide-format/sitemap.xml" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{ canonical_url }}" />
    <meta property="og:title" content="Wide Format Printing Services — Broadstroke, Inc." />
    <meta property="og:description" content="Professional wide format printing, vehicle wraps, and signage with one-call concierge convenience in Wichita, KS." />
    <meta property="og:image" content="/wide-format/images/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="{{ canonical_url }}" />
    <meta property="twitter:title" content="Wide Format Printing Services — Broadstroke, Inc." />
    <meta property="twitter:description" content="" />
    <meta property="twitter:image" content="/wide-format/images/og-image.png" />

    <!-- SEO Meta Tags -->
    <meta name="keywords" content="wide format printing Wichita, large format printing Wichita KS, vehicle wraps Wichita KS, custom signage Wichita, large format graphics Kansas" />
    <meta name="author" content="Wide Format Printing Services — Broadstroke, Inc." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#664400" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="{{ 'favicon.ico' | asset_url }}" />

    <!-- Fonts -->
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Agency+FB:wght@400;700&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-9HXQD6LYZ4"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-9HXQD6LYZ4', { page_path: window.location.pathname });
    </script>

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "name": "Wide Format Printing Services — Broadstroke, Inc.",
          "url": "{{ canonical_url }}",
          "description": "Eye-catching materials and designs that grab the attention of potential customers. Wide format, or large format, printing refers to print that is larger than traditional print sizes. Often more durable, these graphics can be applied to various mediums for outdoor or indoor usage.",
          "publisher": {
            "@type": "Organization",
            "name": "Wide Format Printing Services — Broadstroke, Inc.",
            "url": "{{ canonical_url }}"
          }
        },
        {
          "@type": "BreadcrumbList",
          "itemListElement": [
            { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://www.broadstrokeinc.com" },
            { "@type": "ListItem", "position": 2, "name": "Wide Format Printing Services — Broadstroke, Inc.", "item": "{{ canonical_url }}" }
          ]
        },
        {
          "@type": "Organization",
          "name": "Odin's Innovations",
          "url": "{{ canonical_url }}",
          "logo": "/logo.png",
          "contactPoint": {
            "@type": "ContactPoint",
            "telephone": "316-262-3333",
            "contactType": "customer service",
            "email": "info@broadstrokeinc.com"
          }
        },
        { "@type": "FAQPage", "mainEntity": [] }
      ]
    }
    </script>

    <!-- Mobile-Optimized Meta Tags -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Wide Format Printing Services — Broadstroke, Inc." />
    <meta name="format-detection" content="telephone=no" />

    <!-- Your built CSS + JS - Filenames must match uploaded assets -->
    {{ 'index.css' | asset_url | stylesheet_tag }}
    <script type="module" src="{{ 'index.js' | asset_url }}"></script>
  </head>
  <body>
    <div id="root"></div>

    {{ content_for_footer }}
  </body>
</html>
