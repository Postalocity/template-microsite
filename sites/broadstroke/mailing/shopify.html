{% layout none %}

<!DOCTYPE html>
<html lang="en">
  <head>
    {{ content_for_header }}

    <!-- Base path so the React app finds images in Assets -->
    <base href="https://www.broadstrokeinc.com/" />

    <meta charset="UTF-8" />
    <title>Mailing Services — EDDM, Presort, Certified Mail & Postalocity Automation</title>
    <meta name="description" content="Professional mailing services: EDDM, presort, certified mail, list management, and Postalocity automated platform. Expert print-to-mail solutions with concierge service for businesses, agencies, and government entities nationwide." />

    <!-- Canonical + Sitemap -->
    <link rel="canonical" href="{{ canonical_url }}" />
    <link rel="sitemap" type="application/xml" href="https://broadstrokeinc.com/mailing/sitemap.xml" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{ canonical_url }}" />
    <meta property="og:title" content="Mailing Services — EDDM, Presort, Certified Mail & Postalocity Automation" />
    <meta property="og:description" content="Print, mail, promo & fulfillment made simple." />
    <meta property="og:image" content="/mailing/images/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="{{ canonical_url }}" />
    <meta property="twitter:title" content="Mailing Services — Broadstroke, Inc. | Your One-Stop-Shop for Print, Mail & Promo" />
    <meta property="twitter:description" content="Professional mailing services — EDDM, presort, certified mail, list management, and the Postalocity automated platform — all handled with concierge service from Broadstroke. Expert print-to-mail solutions that save you time and ensure accuracy." />
    <meta property="twitter:image" content="/mailing/images/og-image.png" />

    <!-- SEO Meta Tags -->
    <meta name="keywords" content="mailing services Wichita, EDDM mailing Kansas, bulk mailing services, presort mailing, certified mail Wichita, Postalocity automated mailing, direct mail list management, government utility mail services, address verification NCOA" />
    <meta name="author" content="Mailing Services — Broadstroke, Inc." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#664400" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="{{ 'favicon.ico' | asset_url }}" />

    <!-- Fonts -->
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Agency+FB:wght@400;700&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-9HXQD6LYZ4"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-9HXQD6LYZ4', { page_path: window.location.pathname });
    </script>

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "name": "Mailing Services — Broadstroke, Inc.",
          "url": "{{ canonical_url }}",
          "description": "Professional mailing services — EDDM, presort, certified mail, list management, and the Postalocity automated platform — all handled with concierge service from Broadstroke. Expert print-to-mail solutions that save you time and ensure accuracy.",
          "publisher": {
            "@type": "Organization",
            "name": "Mailing Services — Broadstroke, Inc.",
            "url": "{{ canonical_url }}"
          }
        },
        {
          "@type": "BreadcrumbList",
          "itemListElement": [
            { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://www.broadstrokeinc.com" },
            { "@type": "ListItem", "position": 2, "name": "Mailing Services — Broadstroke, Inc.", "item": "{{ canonical_url }}" }
          ]
        },
        {
          "@type": "Organization",
          "name": "Odin's Innovations",
          "url": "{{ canonical_url }}",
          "logo": "/logo.png",
          "contactPoint": {
            "@type": "ContactPoint",
            "telephone": "316-262-3333",
            "contactType": "customer service",
            "email": "info@broadstrokeinc.com"
          }
        },
        {
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "What is the difference between EDDM and traditional presort mailing?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Every Door Direct Mail (EDDM) targets entire carrier routes without needing a mailing list or permit, making it ideal for local saturation at the lowest postage rates. Presort services use your targeted list and sort mail to qualify for discounted rates on First-Class or Marketing Mail. Broadstroke handles both with concierge service, including list management and address verification."
              }
            },
            {
              "@type": "Question",
              "name": "What is the difference between Broadstroke's mailing services and Postalocity?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Broadstroke can help with just about any mailing job you need, including when you want to purchase a list, when you want to send a mailing that isn't a letter or a postcard, or if your pieces are already printed and you just need us to handle the mailing portion of the job. Postalocity is our digital platform that automates the entire mailing workflow and is a great option for when you need to send something like a letter, notice, bill, invoice, or postcard. You can securely upload PDF files and approve mailings, and we will handle printing, folding, inserting, sealing, and USPS submission. Mailing jobs sent through Postalocity utilize the same high-speed commercial equipment with quality verification systems while meeting USPS formatting standards that traditional mailings do."
              }
            },
            {
              "@type": "Question",
              "name": "What makes your address verification process more effective than standard services?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "We verify address history through the National Change of Address program for four full years instead of the typical 18 months. Combined with CASS certification, this deeper check reduces returned mail and improves delivery rates for utility bills, government notices, and marketing campaigns."
              }
            },
            {
              "@type": "Question",
              "name": "Do you support mailing for government and municipal clients?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes. Broadstroke, Inc. is a trusted partner for cities, counties, parishes, and utilities nationwide. We handle Change of Value Notices, Agricultural Use Surveys, tax mailings, utility bills, and certified mail with secure, compliant processes and concierge oversight."
              }
            },
            {
              "@type": "Question",
              "name": "Can I integrate mailing services with printing and promotional products?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Absolutely. As a full-service provider, we manage end-to-end projects — design, printing, mailing, fulfillment, and promotional items — with one point of contact. This one-stop concierge model eliminates coordination across multiple vendors."
              }
            },
            {
              "@type": "Question",
              "name": "How does Broadstroke ensure accuracy for high-volume mailings?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Every piece routes through our commercial printers and inserters with built-in quality control systems. Lists receive expert change-of-address processing, and all mail meets USPS standards before prompt submission. Documented processes support consistent results for businesses and institutions."
              }
            },
            {
              "@type": "Question",
              "name": "What is included in fulfillment and distribution services?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "We produce, pack, and ship printed materials, apparel, giveaways, or other items you provide. Whether for direct mail campaigns or broader distribution, our team handles the logistics so you receive professional results without managing warehousing or shipping details."
              }
            },
            {
              "@type": "Question",
              "name": "How do I get started with a free estimate for mailing services?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Contact our team at 316-262-3333 or orders@broadstrokeinc.com. Provide details about your project — list size, format, or automation needs — and we will deliver a customized estimate focused on efficiency, accuracy, and convenience."
              }
            }
          ]
        }
      ]
    }
    </script>

    <!-- Mobile-Optimized Meta Tags -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Mailing Services — Broadstroke, Inc." />
    <meta name="format-detection" content="telephone=no" />

    <!-- Your built CSS + JS - Filenames must match uploaded assets -->
    {{ 'index.css' | asset_url | stylesheet_tag }}
    <script type="module" src="{{ 'index.js' | asset_url }}"></script>
  </head>
  <body>
    <div id="root"></div>

    {{ content_for_footer }}
  </body>
</html>
