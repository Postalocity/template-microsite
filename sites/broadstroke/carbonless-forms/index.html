                "@type": "Question",
                "name": "How does carbonless paper work without traditional carbon sheets?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Carbonless paper uses micro-encapsulated dye coatings. The back of each sheet (except the bottom) is coated with microscopic dye capsules, while the front of the underlying sheet has a reactive clay coating. When pressure is applied from writing or impact printing, the capsules burst and release dye that reacts with the clay, creating a permanent copy. This technology eliminates the mess of traditional carbon paper while providing clean, consistent duplicates."
