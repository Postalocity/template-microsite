{% layout none %}

<!DOCTYPE html>
<html lang="en">
  <head>
    {{ content_for_header }}

    <!-- Base path so the React app finds images in Assets -->
    <base href="https://www.broadstrokeinc.com/" />

    <meta charset="UTF-8" />
    <title>Custom Carbonless Forms — Nationwide Distribution</title>
    <meta name="description" content="Nationwide custom carbonless forms printing. 2, 3, and 4-part multipart forms with sequential numbering, variable data, and fast turnaround. Free estimates." />

    <!-- Canonical + Sitemap -->
    <link rel="canonical" href="{{ canonical_url }}" />
    <link rel="sitemap" type="application/xml" href="https://broadstrokeinc.com/carbonless-forms/sitemap.xml" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{ canonical_url }}" />
    <meta property="og:title" content="Custom Carbonless Forms | Carbonless Printing - Broadstroke" />
    <meta property="og:description" content="Custom 2, 3, and 4-part carbonless forms with precision printing and finishing. Get a free estimate." />
    <meta property="og:image" content="/carbonless-forms/images/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="{{ canonical_url }}" />
    <meta property="twitter:title" content="Custom Carbonless Forms — Broadstroke, Inc. | Your One-Stop-Shop for Print, Mail & Promo" />
    <meta property="twitter:description" content="CarbonlessUSA.com is now part of Broadstroke — bringing you the same quality carbonless forms you trust, now with access to comprehensive print, mail, and promotional services. High-quality 2, 3, and 4-part carbonless forms with advanced customization, finishing services, and seamless integration with shipping and fulfillment." />
    <meta property="twitter:image" content="/carbonless-forms/images/og-image.png" />

    <!-- SEO Meta Tags -->
    <meta name="keywords" content="custom carbonless forms, carbonless forms printing, 2 part carbonless forms, 3 part carbonless forms, 4 part carbonless forms, multipart forms, carbonless printing, sequential numbering forms, business forms printing" />
    <meta name="author" content="Custom Carbonless Forms — Broadstroke, Inc." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#664400" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="{{ 'favicon.ico' | asset_url }}" />

    <!-- Fonts -->
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Agency+FB:wght@400;700&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-9HXQD6LYZ4"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-9HXQD6LYZ4', { page_path: window.location.pathname });
    </script>

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "name": "Custom Carbonless Forms — Broadstroke, Inc.",
          "url": "{{ canonical_url }}",
          "description": "CarbonlessUSA.com is now part of Broadstroke — bringing you the same quality carbonless forms you trust, now with access to comprehensive print, mail, and promotional services. High-quality 2, 3, and 4-part carbonless forms with advanced customization, finishing services, and seamless integration with shipping and fulfillment.",
          "publisher": {
            "@type": "Organization",
            "name": "Custom Carbonless Forms — Broadstroke, Inc.",
            "url": "{{ canonical_url }}"
          }
        },
        {
          "@type": "BreadcrumbList",
          "itemListElement": [
            { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://www.broadstrokeinc.com" },
            { "@type": "ListItem", "position": 2, "name": "Custom Carbonless Forms — Broadstroke, Inc.", "item": "{{ canonical_url }}" }
          ]
        },
        {
          "@type": "Organization",
          "name": "Odin's Innovations",
          "url": "{{ canonical_url }}",
          "logo": "/logo.png",
          "contactPoint": {
            "@type": "ContactPoint",
            "telephone": "316-262-3333",
            "contactType": "customer service",
            "email": "info@broadstrokeinc.com"
          }
        },
        { "@type": "FAQPage", "mainEntity": [] }
      ]
    }
    </script>

    <!-- Mobile-Optimized Meta Tags -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Custom Carbonless Forms — Broadstroke, Inc." />
    <meta name="format-detection" content="telephone=no" />

    <!-- Your built CSS + JS - Filenames must match uploaded assets -->
    {{ 'index.css' | asset_url | stylesheet_tag }}
    <script type="module" src="{{ 'index.js' | asset_url }}"></script>
  </head>
  <body>
    <div id="root"></div>

    {{ content_for_footer }}
  </body>
</html>
