{% layout none %}

<!DOCTYPE html>
<html lang="en">
  <head>
    {{ content_for_header }}

    <!-- Base path so the React app finds images in Assets -->
    <base href="https://www.broadstrokeinc.com/" />

    <meta charset="UTF-8" />
    <title>Professional Printing Services — Broadstroke</title>
    <meta name="description" content="High-quality printing services in Wichita. Business cards, brochures, flyers, banners and more. Quick turnaround, free estimates." />

    <!-- Canonical + Sitemap -->
    <link rel="canonical" href="{{ canonical_url }}" />
    <link rel="sitemap" type="application/xml" href="https://broadstrokeinc.com/printing/sitemap.xml" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{ canonical_url }}" />
    <meta property="og:title" content="Professional Printing Services — Broadstroke" />
    <meta property="og:description" content="High-quality printing services with quick turnaround. Free estimates on all projects." />
    <meta property="og:image" content="/printing/images/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="{{ canonical_url }}" />
    <meta property="twitter:title" content="Professional Printing Services" />
    <meta property="twitter:description" content="" />
    <meta property="twitter:image" content="/printing/images/og-image.png" />

    <!-- SEO Meta Tags -->
    <meta name="keywords" content="printing services Wichita, business printing, brochure printing, flyer printing, banner printing, wide format printing" />
    <meta name="author" content="Professional Printing Services" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#664400" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="{{ 'favicon.ico' | asset_url }}" />

    <!-- Fonts -->
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Agency+FB:wght@400;700&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-9HXQD6LYZ4"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-9HXQD6LYZ4', { page_path: window.location.pathname });
    </script>

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "name": "Professional Printing Services",
          "url": "{{ canonical_url }}",
          "description": "High-quality printing for your business. From business cards to large format banners, we deliver exceptional results with quick turnaround times.",
          "publisher": {
            "@type": "Organization",
            "name": "Professional Printing Services",
            "url": "{{ canonical_url }}"
          }
        },
        {
          "@type": "BreadcrumbList",
          "itemListElement": [
            { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://www.broadstrokeinc.com" },
            { "@type": "ListItem", "position": 2, "name": "Professional Printing Services", "item": "{{ canonical_url }}" }
          ]
        },
        {
          "@type": "Organization",
          "name": "Odin's Innovations",
          "url": "{{ canonical_url }}",
          "logo": "logo.png",
          "contactPoint": {
            "@type": "ContactPoint",
            "telephone": "316-262-3333",
            "contactType": "customer service",
            "email": "info@broadstrokeinc.com"
          }
        },
        {
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "Do you offer free estimates?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes! We provide free, accurate quotes on all printing projects. Just share your project details and we'll get you a price within 24 hours."
              }
            },
            {
              "@type": "Question",
              "name": "What file formats do you accept?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "We accept PDF, AI, EPS, PSD, and many other formats. Our team can also help prepare your files for print."
              }
            },
            {
              "@type": "Question",
              "name": "How quickly can you complete my order?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": " turnaround times vary by project complexity. Same-day and next-day services are available for urgent jobs."
              }
            },
            {
              "@type": "Question",
              "name": "Do you deliver?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes! We offer delivery within the Wichita area and can ship nationwide. Large format items can be professionally installed."
              }
            }
          ]
        }
      ]
    }
    </script>

    <!-- Mobile-Optimized Meta Tags -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Professional Printing Services" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Your built CSS + JS - Filenames must match uploaded assets -->
    {{ 'index.css' | asset_url | stylesheet_tag }}
    <script type="module" src="{{ 'index.js' | asset_url }}"></script>
  </head>
  <body>
    <div id="root"></div>

    {{ content_for_footer }}
  </body>
</html>
