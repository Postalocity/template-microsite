{% layout none %}

<!DOCTYPE html>
<html lang="en">
  <head>
    {{ content_for_header }}

    <!-- Base path so the React app finds images in Assets -->
    <base href="https://www.broadstrokeinc.com/" />

    <meta charset="UTF-8" />
    <title>Mail Pickup Services — Broadstroke, Inc.</title>
    <meta name="description" content="Daily mail pickup services in Wichita KS with presort postage, certified mail support, flats handling and full concierge integration. Reclaim operational time with one-stop print, mail and promo delivery. Free estimates available." />

    <!-- Canonical + Sitemap -->
    <link rel="canonical" href="{{ canonical_url }}" />
    <link rel="sitemap" type="application/xml" href="https://broadstrokeinc.com/mail-pickup/sitemap.xml" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{ canonical_url }}" />
    <meta property="og:title" content="Mail Pickup Services — Broadstroke, Inc." />
    <meta property="og:description" content="Convenient daily mail collection with expert presort processing, print and promo delivery — all handled by one Wichita team." />
    <meta property="og:image" content="/mail-pickup/images/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="{{ canonical_url }}" />
    <meta property="twitter:title" content="Mail Pickup Services — Broadstroke, Inc." />
    <meta property="twitter:description" content="" />
    <meta property="twitter:image" content="/mail-pickup/images/og-image.png" />

    <!-- SEO Meta Tags -->
    <meta name="keywords" content="mail pickup services, mail pickup Wichita, daily mail pickup, presort mail pickup, certified mail pickup, EDDM pickup Wichita, bulk mail services Kansas, mailroom pickup service" />
    <meta name="author" content="Mail Pickup Services — Broadstroke, Inc." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#664400" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="{{ 'favicon.ico' | asset_url }}" />

    <!-- Fonts -->
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Agency+FB:wght@400;700&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-9HXQD6LYZ4"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-9HXQD6LYZ4', { page_path: window.location.pathname });
    </script>

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "name": "Mail Pickup Services — Broadstroke, Inc.",
          "url": "{{ canonical_url }}",
          "description": "Eliminate trips to the post office and save costs with presort postage when you have Broadstroke pick up your mail. Have a print or promo job you ordered through Broadstroke? We'll deliver your print or promo order when we swing by to pick up your mail.",
          "publisher": {
            "@type": "Organization",
            "name": "Mail Pickup Services — Broadstroke, Inc.",
            "url": "{{ canonical_url }}"
          }
        },
        {
          "@type": "BreadcrumbList",
          "itemListElement": [
            { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://www.broadstrokeinc.com" },
            { "@type": "ListItem", "position": 2, "name": "Mail Pickup Services — Broadstroke, Inc.", "item": "{{ canonical_url }}" }
          ]
        },
        {
          "@type": "Organization",
          "name": "Odin's Innovations",
          "url": "{{ canonical_url }}",
          "logo": "/logo.png",
          "contactPoint": {
            "@type": "ContactPoint",
            "telephone": "316-262-3333",
            "contactType": "customer service",
            "email": "info@broadstrokeinc.com"
          }
        },
        {
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "What types of mail does Broadstroke pick up daily?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Broadstroke collects standard letters, flats and large envelopes, parcels, priority mail, certified mail, international mail, nonprofit, and marketing mail. Our professional mailroom staff handles sorting and presort postage application for eligible pieces."
              }
            },
            {
              "@type": "Question",
              "name": "Do I need to prepare mail in a specific way before pickup?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "For presort postage, separate pieces needing postage from pre-metered items. Flats and large envelopes should be sealed with tape over metal clasps. Handwritten addresses must use black ink and allow proper space at the bottom to qualify for presort rates. We provide guidance on USPS-compliant formatting."
              }
            },
            {
              "@type": "Question",
              "name": "Can Broadstroke deliver print or promotional product orders during mail pickup?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes. A key convenience of our service is the ability to deliver completed commercial printing or branded promotional items on the same daily visit, eliminating extra trips and vendor coordination."
              }
            },
            {
              "@type": "Question",
              "name": "Who is eligible for Broadstroke mail pickup services?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Businesses of all sizes in the Wichita area and surrounding regions that generate regular outbound mail benefit from our service. We serve utilities, healthcare practices, financial institutions, real estate firms, municipalities, ad agencies, and more."
              }
            },
            {
              "@type": "Question",
              "name": "How does Broadstroke maintain USPS compliance and best rates?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "As a member of the National Association of Presort Mailers (NAPM), Broadstroke stays current with USPS standards and innovations."
              }
            }
          ]
        }
      ]
    }
    </script>

    <!-- Mobile-Optimized Meta Tags -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Mail Pickup Services — Broadstroke, Inc." />
    <meta name="format-detection" content="telephone=no" />

    <!-- Your built CSS + JS - Filenames must match uploaded assets -->
    {{ 'index.css' | asset_url | stylesheet_tag }}
    <script type="module" src="{{ 'index.js' | asset_url }}"></script>
  </head>
  <body>
    <div id="root"></div>

    {{ content_for_footer }}
  </body>
</html>
