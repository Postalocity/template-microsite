{% layout none %}

<!DOCTYPE html>
<html lang="en">
  <head>
    {{ content_for_header }}

    <!-- Base path so the React app finds images in Assets -->
    <base href="https://www.broadstrokeinc.com/" />

    <meta charset="UTF-8" />
    <title>Commercial Printing Services Wichita KS — Broadstroke, Inc.</title>
    <meta name="description" content="Trusted commercial printing in Wichita KS since 1964. Business cards, brochures, forms, wide format, offset & digital printing with full-service finishing and in-house mailing. Free estimates." />

    <!-- Canonical + Sitemap -->
    <link rel="canonical" href="{{ canonical_url }}" />
    <link rel="sitemap" type="application/xml" href="https://www.broadstrokeinc.com/commercial-printing/sitemap.xml" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{ canonical_url }}" />
    <meta property="og:title" content="Commercial Printing Services — Broadstroke, Inc." />
    <meta property="og:description" content="One-stop commercial printing solutions in Wichita KS: quality printing with seamless design, finishing, mailing, and promo integration." />
    <meta property="og:image" content="https://www.broadstrokeinc.com/commercial-printing/images/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="{{ canonical_url }}" />
    <meta property="twitter:title" content="Commercial Printing — Broadstroke, Inc." />
    <meta property="twitter:description" content="One-stop commercial printing solutions in Wichita KS: quality printing with seamless design, finishing, mailing, and promo integration." />
    <meta property="twitter:image" content="https://www.broadstrokeinc.com/commercial-printing/images/og-image.png" />

    <!-- SEO Meta Tags -->
    <meta name="keywords" content="commercial printing Wichita, printing services Wichita KS, commercial printer Wichita, business card printing Wichita, brochure printing Wichita, bulk printing services Wichita, offset printing Wichita, digital printing Wichita, wide format printing Wichita, finishing services Wichita, one-stop print mail services Wichita" />
    <meta name="author" content="Broadstroke" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#8B4513" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="{{ 'favicon.ico' | asset_url }}" />

    <!-- Fonts -->
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Agency+FB:wght@400;700&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-9HXQD6LYZ4"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-9HXQD6LYZ4', { page_path: window.location.pathname });
    </script>

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "name": "Commercial Printing — Broadstroke, Inc.",
          "url": "{{ canonical_url }}",
          "description": "High-quality digital and offset printing with dedicated concierge service — one experienced team handles everything from design through finishing and optional mailing. Free estimates, quick turnaround, no project too big or small.",
          "publisher": {
            "@type": "Organization",
            "name": "Broadstroke",
            "url": "https://www.broadstrokeinc.com"
          }
        },
        {
          "@type": "BreadcrumbList",
          "itemListElement": [
            { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://www.broadstrokeinc.com" },
            { "@type": "ListItem", "position": 2, "name": "Commercial Printing — Broadstroke, Inc.", "item": "{{ canonical_url }}" }
          ]
        },
        {
          "@type": "Organization",
          "name": "Broadstroke",
          "url": "https://www.broadstrokeinc.com",
          "logo": "{{ 'logo.png' | asset_url }}",
          "contactPoint": {
            "@type": "ContactPoint",
            "telephone": "316-262-3333",
            "contactType": "customer service",
            "email": "orders@broadstrokeinc.com"
          }
        },
        {
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "What file formats do you accept for commercial printing projects?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "We recommend submitting files in a high-resolution PDF format, but we also accept native files from common design programs such as Adobe InDesign, Illustrator, and Photoshop. Please inquire with us if you have a different file format, as we may still be able to accept it. Our team reviews all files and provides guidance on preparation to ensure optimal print quality."
              }
            },
            {
              "@type": "Question",
              "name": "Is design assistance available?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "In-house designers are available to create a design for you from conception or to refine layouts, optimize images, and prepare files from artwork you supply to us. Whether you need minor adjustments or full creative support, our team handles every detail."
              }
            },
            {
              "@type": "Question",
              "name": "Can printed materials be mailed in-house?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Absolutely. Completed pieces move seamlessly into fulfillment, presort postage is applied and pieces are provided to USPS for delivery — all managed by the same concierge team."
              }
            },
            {
              "@type": "Question",
              "name": "What types of finishing options are available?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "We provide a full range of finishing services including folding, scoring, die-cutting, binding (coil, perfect, saddle stitch, drilling), perforating, numbering, corner rounding, custom foil imprint, embossing, laminating (gloss, matte, soft touch), padding, UV coating, spot UV, spiral binding, wire binding, shrink wrapping, tabbing, and custom kitting/packaging."
              }
            },
            {
              "@type": "Question",
              "name": "How does the concierge model benefit commercial printing projects?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "You have a single dedicated point of contact that oversees the entire workflow on your behalf — from file review through production, finishing, and optional mailing. This eliminates coordination across multiple vendors and helps your organization reclaim operational time weekly."
              }
            },
            {
              "@type": "Question",
              "name": "What is the process for obtaining a free estimate?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Simply submit details through our contact form, email orders@broadstrokeinc.com, or call 316-262-3333. A member of our team will review your project and provide a clear, no-obligation estimate with recommended options and timelines."
              }
            }
          ]
        }
      ]
    }
    </script>

    <!-- Mobile-Optimized Meta Tags -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Commercial Printing — Broadstroke, Inc." />
    <meta name="format-detection" content="telephone=no" />

    <!-- Your built CSS + JS - Filenames must match uploaded assets -->
    {{ 'index.css' | asset_url | stylesheet_tag }}
    <script type="module" src="{{ 'index.js' | asset_url }}"></script>
  </head>
  <body>
    <!-- PRERENDERED_CONTENT: post-build injects dist/index.html #root innerHTML here -->
    <div id="root"></div>

    {{ content_for_footer }}
  </body>
</html>
