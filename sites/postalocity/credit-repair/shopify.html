{% layout none %}

<!DOCTYPE html>
<html lang="en">
  <head>
    {{ content_for_header }}

    <!-- Base path so the React app finds images in Assets -->
    <base href="https://www.postalocity.com/" />

    <meta charset="UTF-8" />
    <title>Automate Dispute Letter Mailing Service | Credit Repair Mailing Service</title>
    <meta name="description" content="Automated dispute letter mailing from $1.31/letter. Reclaim significant time. Free signup, address verification, Certified Mail, USPS tracking, API integration." />

    <!-- Canonical + Sitemap -->
    <link rel="canonical" href="{{ canonical_url }}" />
    <link rel="sitemap" type="application/xml" href="https://postalocity.compostalocity-credit-repair/sitemap.xml" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{ canonical_url }}" />
    <meta property="og:title" content="Automate Dispute Letter Mailing | Reclaim Hours Weekly" />
    <meta property="og:description" content="Credit repair professionals save hours weekly with automated dispute letter mailing. Includes address verification, Certified Mail, USPS tracking, and software integration." />
    <meta property="og:image" content="{{ 'og-image.png' | asset_url }}" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="{{ canonical_url }}" />
    <meta property="twitter:title" content="Dispute Letter Mailing Automation | Credit Repair Mailing Service" />
    <meta property="twitter:description" content="Save hours weekly with automated dispute letter mailing. Address verification, Certified Mail, USPS tracking, API integration with credit repair software." />
    <meta property="twitter:image" content="{{ 'og-image.png' | asset_url }}" />

    <!-- SEO Meta Tags -->
    <meta name="keywords" content="dispute letter mailing service, credit repair mailing service, automated mailing credit repair, print and mail dispute letters, credit repair automated mailing, mailing dispute letters credit repair, credit repair print and mail, certified mail credit repair disputes, bulk dispute letters mailing, automate credit repair mailings, Credit Repair Mailing Service, Automated Dispute Letter Mailing" />
    <meta name="author" content="Credit Repair Mailing Service" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#664400" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="{{ 'favicon.ico' | asset_url }}" />

    <!-- Fonts -->
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Agency+FB:wght@400;700&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-9HXQD6LYZ4"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-9HXQD6LYZ4', { page_path: window.location.pathname });
    </script>

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "name": "Credit Repair Mailing Service",
          "url": "{{ canonical_url }}",
          "description": "Credit repair professionals handle high volumes of dispute letters to Equifax, Experian, TransUnion, and creditors. Postalocity's automated mailing platform streamlines processing with address verification, Certified Mail options, and USPS scanning—reclaiming hours weekly for client strategy.",
          "publisher": {
            "@type": "Organization",
            "name": "Credit Repair Mailing Service",
            "url": "{{ canonical_url }}"
          }
        },
        {
          "@type": "BreadcrumbList",
          "itemListElement": [
            { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://www.postalocity.com" },
            { "@type": "ListItem", "position": 2, "name": "Credit Repair Mailing Service", "item": "{{ canonical_url }}" }
          ]
        },
        {
          "@type": "Organization",
          "name": "Odin's Innovations",
          "url": "{{ canonical_url }}",
          "logo": "logo.png",
          "contactPoint": {
            "@type": "ContactPoint",
            "telephone": "316-260-2220",
            "contactType": "customer service",
            "email": "contact@postalocity.com"
          }
        },
        { "@type": "FAQPage", "mainEntity": [] }
      ]
    }
    </script>

    <!-- Mobile-Optimized Meta Tags -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Credit Repair Mailing Service" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Your built CSS + JS - Filenames must match uploaded assets -->
    {{ 'index.css' | asset_url | stylesheet_tag }}
    <script type="module" src="{{ 'index.js' | asset_url }}"></script>
  </head>
  <body>
    <div id="root"></div>

    {{ content_for_footer }}
  </body>
</html>
