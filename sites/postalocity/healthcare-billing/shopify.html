{% layout none %}

<!DOCTYPE html>
<html lang="en">
  <head>
    {{ content_for_header }}

    <!-- Base path so the React app finds images in Assets -->
    <base href="https://www.postalocity.com/" />

    <meta charset="UTF-8" />
    <title>Automate Patient Statement Mailing | Healthcare Mailing Services</title>
    <meta name="description" content="Healthcare providers reclaim significant time with Postalocity's automated patient statement mailing. HIPAA-compliant, address verification, Certified Mail options, and EMR integration." />

    <!-- Canonical + Sitemap -->
    <link rel="canonical" href="{{ canonical_url }}" />
    <link rel="sitemap" type="application/xml" href="https://postalocity.compostalocity-healthcare-billing/sitemap.xml" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{ canonical_url }}" />
    <meta property="og:title" content="Automate Patient Statement Mailing | Significant Time Savings" />
    <meta property="og:description" content="Healthcare providers save significant time with automated patient statement mailing. HIPAA-compliant, address verification, Certified Mail, EMR integration." />
    <meta property="og:image" content="{{ 'og-image.png' | asset_url }}" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="{{ canonical_url }}" />
    <meta property="twitter:title" content="Patient Statement Automation | Healthcare Mailing Services" />
    <meta property="twitter:description" content="Reclaim significant time with automated patient statement mailing. HIPAA-compliant, address verification, Certified Mail, EMR integration with systems." />
    <meta property="twitter:image" content="{{ 'og-image.png' | asset_url }}" />

    <!-- SEO Meta Tags -->
    <meta name="keywords" content="patient statement mailing, healthcare mailing services, automated patient statements, print and mail patient statements, healthcare statement processing, medical billing mailing, patient statements HIPAA compliant, bulk patient statement mailing, automate patient statements, Healthcare Mailing Services, Automated Patient Statement Mailing" />
    <meta name="author" content="Healthcare Billing Solutions" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#664400" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="{{ 'favicon.ico' | asset_url }}" />

    <!-- Fonts -->
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Agency+FB:wght@400;700&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-9HXQD6LYZ4"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-9HXQD6LYZ4', { page_path: window.location.pathname });
    </script>

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "name": "Healthcare Billing Solutions",
          "url": "{{ canonical_url }}",
          "description": "Clinical and administrative professionals report spending significant time on revenue cycle tasks. Our audit identifies significant weekly savings through workflow optimization.",
          "publisher": {
            "@type": "Organization",
            "name": "Healthcare Billing Solutions",
            "url": "{{ canonical_url }}"
          }
        },
        {
          "@type": "BreadcrumbList",
          "itemListElement": [
            { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://www.postalocity.com" },
            { "@type": "ListItem", "position": 2, "name": "Healthcare Billing Solutions", "item": "{{ canonical_url }}" }
          ]
        },
        {
          "@type": "Organization",
          "name": "Odin's Innovations",
          "url": "{{ canonical_url }}",
          "logo": "logo.png",
          "contactPoint": {
            "@type": "ContactPoint",
            "telephone": "316-260-2220",
            "contactType": "customer service",
            "email": "contact@postalocity.com"
          }
        },
        {
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "How long does implementation take?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Our streamlined implementation process typically takes 4-6 weeks from initial kickoff to full deployment. This timeframe includes comprehensive workflow audit, system configuration, data migration from existing platforms, staff training on optimized workflows, test environment validation, and full go-live support with on-site assistance to ensure zero business disruption."
              }
            },
            {
              "@type": "Question",
              "name": "What types of healthcare organizations do you serve?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "We work with physician practices spanning family medicine, orthopedics, cardiology, dermatology, pediatrics, and internal medicine, plus multi-specialty groups, independent hospitals, outpatient surgery centers, urgent care facilities, therapy clinics, and ambulatory care facilities across 12 states. Our solutions scale from 3-provider practices to hospital revenue cycles."
              }
            },
            {
              "@type": "Question",
              "name": "How do you ensure data security?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "We implement enterprise-grade security measures including AES-256 encryption for data at rest and TLS 1.3 for data in transit, role-based access control with comprehensive audit logging, secure two-factor authentication for administrative access, regular penetration testing by third-party security firms, business associate agreements compliant with HIPAA requirements, and adherence to NIST 800-53 cybersecurity frameworks."
              }
            },
            {
              "@type": "Question",
              "name": "What is your typical ROI timeline?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Most organizations realize significant time savings within 60-90 days through three mechanisms: claim processing acceleration reducing submission cycles by 70-75%, intelligent error detection preventing denials and rework by eliminating common coding errors before submission, and workflow automation reducing administrative overhead through exception-based processing that allows staff to focus on exceptions rather than routine manual processes."
              }
            },
            {
              "@type": "Question",
              "name": "Do you provide ongoing support?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "We offer comprehensive support including dedicated account managers with industry-specific expertise, 24/7 customer service with US-based billing specialists, monthly performance reviews with actionable insights and optimization recommendations, quarterly workflow optimization assessments, access to certified healthcare compliance specialists for regulatory questions, and annual compliance audits to ensure continued regulatory adherence as requirements evolve."
              }
            }
          ]
        }
      ]
    }
    </script>

    <!-- Mobile-Optimized Meta Tags -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Healthcare Billing Solutions" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Your built CSS + JS - Filenames must match uploaded assets -->
    {{ 'index.css' | asset_url | stylesheet_tag }}
    <script type="module" src="{{ 'index.js' | asset_url }}"></script>
  </head>
  <body>
    <div id="root"></div>

    {{ content_for_footer }}
  </body>
</html>
