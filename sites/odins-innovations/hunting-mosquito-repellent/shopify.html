{% layout none %}

<!DOCTYPE html>
<html lang="en">
  <head>
    {{ content_for_header }}

    <!-- Base path so the React app finds images in Assets -->
    <base href="https://www.odinsinnovations.com/" />

    <meta charset="UTF-8" />
    <title>Hunting Mosquito Repellent — Citronella Liquid & Beads | DEET-Free, Scent-Smart</title>
    <meta name="description" content="Odin's citronella hunting mosquito repellent creates a rainproof protective barrier on foliage. DEET-free, masks CO₂ and lactic acid cues. Up to 720-hour sustained release. Perfect for turkey, deer, and early bow season. Pairs with scent beads for reduced reapplication time." />

    <!-- Canonical + Sitemap -->
    <link rel="canonical" href="{{ canonical_url }}" />
    <link rel="sitemap" type="application/xml" href="https://www.odinsinnovations.com/hunting-mosquito-repellent/sitemap.xml" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{ canonical_url }}" />
    <meta property="og:title" content="Citronella Hunting Mosquito Repellent — Up to 720 Hours Barrier" />
    <meta property="og:description" content="Synthetic oil-based liquid and biodegradable polymer beads engineered for consistent, weatherproof protection around stands and blinds without strong chemical odors." />
    <meta property="og:image" content="/hunting-mosquito-repellent/images/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="{{ canonical_url }}" />
    <meta property="twitter:title" content="Hunting Mosquito Repellent" />
    <meta property="twitter:description" content="" />
    <meta property="twitter:image" content="/hunting-mosquito-repellent/images/og-image.png" />

    <!-- SEO Meta Tags -->
    <meta name="keywords" content="hunting mosquito repellent, citronella hunting, deer hunting mosquito repellent, mosquito repellent for turkey hunting, DEET free mosquito repellent hunting, citronella in hunting blind, long lasting mosquito repellent hunting, bug repellent citronella, insect repellent for deer hunting" />
    <meta name="author" content="Hunting Mosquito Repellent" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#664400" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://cdn.shopify.com/s/files/1/0555/8049/1971/files/Odins_favicon.png?v=1618500553" />

    <!-- Fonts -->
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Agency+FB:wght@400;700&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-XXXXXXXXXX', { page_path: window.location.pathname });
    </script>

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "name": "Hunting Mosquito Repellent",
          "url": "{{ canonical_url }}",
          "description": "Synthetic, oil-based liquid and biodegradable polymer beads engineered for consistent protective barriers on foliage while reducing reapplication time.",
          "publisher": {
            "@type": "Organization",
            "name": "Hunting Mosquito Repellent",
            "url": "{{ canonical_url }}"
          }
        },
        {
          "@type": "BreadcrumbList",
          "itemListElement": [
            { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://www.odinsinnovations.com" },
            { "@type": "ListItem", "position": 2, "name": "Hunting Mosquito Repellent", "item": "{{ canonical_url }}" }
          ]
        },
        {
          "@type": "Organization",
          "name": "Odin's Innovations",
          "url": "{{ canonical_url }}",
          "logo": "/logo.png",
          "contactPoint": {
            "@type": "ContactPoint",
            "telephone": "316-393-0440",
            "contactType": "customer service",
            "email": "paul@odinsinnovations.com"
          }
        },
        { "@type": "FAQPage", "mainEntity": [] }
      ]
    }
    </script>

    <!-- Mobile-Optimized Meta Tags -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Hunting Mosquito Repellent" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Your built CSS + JS - Filenames must match uploaded assets -->
    {{ 'index.css' | asset_url | stylesheet_tag }}
    <script type="module" src="{{ 'index.js' | asset_url }}"></script>
  </head>
  <body>
    <div id="root"></div>

    {{ content_for_footer }}
  </body>
</html>
