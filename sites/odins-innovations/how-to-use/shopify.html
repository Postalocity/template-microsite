{% layout none %}

<!DOCTYPE html>
<html lang="en">
  <head>
    {{ content_for_header }}

    <!-- Base path so the React app finds images in Assets -->
    <base href="https://www.odinsinnovations.com/" />

    <meta charset="UTF-8" />
    <title>How to Use Odin's Scent Beads & Liquids: The Complete Field Guide — 30+ Days Attraction</title>
    <meta name="description" content="Learn how to use synthetic scent beads and liquids for deer, hogs, bears, and elk. Trail camera setups, mock scrape deployment, seasonal calendar, and professional deployment tactics. 30+ days consistent release, legal in all 50 states, biodegradable." />

    <!-- Canonical + Sitemap -->
    <link rel="canonical" href="{{ canonical_url }}" />
    <link rel="sitemap" type="application/xml" href="https://www.odinsinnovations.com/how-to-use/sitemap.xml" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{ canonical_url }}" />
    <meta property="og:title" content="How to Use Odin's Scent Beads & Liquids — Complete Field Guide" />
    <meta property="og:description" content="Professional deployment guide for synthetic scent beads and liquids. 30+ days weatherproof attraction, trail camera optimization, seasonal calendar, and mock scrape tactics." />
    <meta property="og:image" content="https://cdn.shopify.com/s/files/1/0555/8049/1971/files/Odins_Innovations_Lure_Scrape_Mock_Scents_Liquids_Beads.jpg?v=1778522753" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="{{ canonical_url }}" />
    <meta property="twitter:title" content="How to Use Odin's Scent Beads & Liquids" />
    <meta property="twitter:description" content="" />
    <meta property="twitter:image" content="https://cdn.shopify.com/s/files/1/0555/8049/1971/files/Odins_Innovations_Lure_Scrape_Mock_Scents_Liquids_Beads.jpg?v=1778522753" />

    <!-- SEO Meta Tags -->
    <meta name="keywords" content="how to use scent beads, deer scent deployment, trail camera scent, seasonal scent calendar, mock scrape setup, synthetic scent beads, long lasting scent beads, doe estrus scent beads" />
    <meta name="author" content="How to Use Odin's Scent Beads & Liquids" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#664400" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://cdn.shopify.com/s/files/1/0555/8049/1971/files/Odins_favicon.png?v=1618500553" />

    <!-- Fonts -->
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Agency+FB:wght@400;700&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-XXXXXXXXXX', { page_path: window.location.pathname });
    </script>

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "name": "How to Use Odin's Scent Beads & Liquids",
          "url": "{{ canonical_url }}",
          "description": "Beads for 30-day attraction. Liquids for scent trails. Seasonal calendar, mock scrape setup, trail camera tactics, and advanced tips — all in one place.",
          "publisher": {
            "@type": "Organization",
            "name": "How to Use Odin's Scent Beads & Liquids",
            "url": "{{ canonical_url }}"
          }
        },
        {
          "@type": "BreadcrumbList",
          "itemListElement": [
            { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://www.odinsinnovations.com" },
            { "@type": "ListItem", "position": 2, "name": "How to Use Odin's Scent Beads & Liquids", "item": "{{ canonical_url }}" }
          ]
        },
        {
          "@type": "Organization",
          "name": "Odin's Innovations",
          "url": "{{ canonical_url }}",
          "logo": "/logo.png",
          "contactPoint": {
            "@type": "ContactPoint",
            "telephone": "316-393-0440",
            "contactType": "customer service",
            "email": "support@odinsscents.com"
          }
        },
        { "@type": "FAQPage", "mainEntity": [] }
      ]
    }
    </script>

    <!-- Mobile-Optimized Meta Tags -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="How to Use Odin's Scent Beads & Liquids" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Your built CSS + JS - Filenames must match uploaded assets -->
    {{ 'index.css' | asset_url | stylesheet_tag }}
    <script type="module" src="{{ 'index.js' | asset_url }}"></script>
  </head>
  <body>
    <div id="root"></div>

    {{ content_for_footer }}
  </body>
</html>
