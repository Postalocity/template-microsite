{% layout none %}

<!DOCTYPE html>
<html lang="en">
  <head>
    {{ content_for_header }}

    <!-- Base path so the React app finds images in Assets -->
    <base href="https://www.odinsinnovations.com/" />

    <meta charset="UTF-8" />
    <title>Citronella Mosquito Repellent | 30+ Day Protection | Odin's</title>
    <meta name="description" content="Citronella mosquito repellent for hunting: 30+ days protection, rainproof, milder scent than DEET, EPA-registered. Starting at $14.95 — use code HUNT2026. Shop now." />

    <!-- Canonical + Sitemap -->
    <link rel="canonical" href="{{ canonical_url }}" />
    <link rel="sitemap" type="application/xml" href="https://www.odinsinnovations.com/pages/hunting-mosquito-repellent/sitemap.xml" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{ canonical_url }}" />
    <meta property="og:title" content="Citronella Mosquito Repellent — 30+ Days of Protection" />
    <meta property="og:description" content="Long-lasting citronella mosquito repellent for hunters. Rainproof, milder scent than DEET, legal in all 50 states." />

    <meta property="twitter:url" content="{{ canonical_url }}" />
    <meta property="twitter:title" content="Citronella Mosquito Repellent" />
    <meta property="twitter:description" content="Long-lasting citronella mosquito repellent for hunters. Rainproof, milder scent than DEET." />
    <meta property="twitter:image" content="https://cdn.shopify.com/s/files/1/0555/8049/1971/files/hero.jpg?v=1776346221" />

    <!-- SEO Meta Tags -->
    <meta name="keywords" content="citronella mosquito repellent, hunting mosquito repellent, long lasting mosquito repellent, rainproof mosquito repellent, milder scent than DEET, EPA registered mosquito repellent, mosquito repellent for hunters, 30 day mosquito protection, mosquito repellent beads, biodegradable mosquito repellent, legal in all 50 states, outdoor mosquito protection, hunting scent control, mosquito barrier spray" />

    <meta name="theme-color" content="#2d5a3d" />

    <!-- Fonts -->

    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-XXXXXXXXXX', { page_path: window.location.pathname });
    </script>

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">

        {
          "@type": "WebSite",

            "@type": "ContactPoint",
            "telephone": "316-393-0440",
            "contactType": "customer service",
            "email": "paul@odinsinnovations.com"
          }
        },
        { "@type": "FAQPage", "mainEntity": [] }

    <meta name="format-detection" content="telephone=no" />
