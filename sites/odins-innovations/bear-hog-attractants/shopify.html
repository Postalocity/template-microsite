{% layout none %}

<!DOCTYPE html>
<html lang="en">
  <head>
    {{ content_for_header }}

    <!-- Base path so the React app finds images in Assets -->
    <base href="https://www.odinsinnovations.com/" />

    <meta charset="UTF-8" />
    <title>Bear & Hog Attractants: Synthetic Scent Beads for America's Fastest-Growing Hunts</title>
    <meta name="description" content="Bear attractant and feral hog attractant beads engineered for 30+ days of consistent, weatherproof release. Synthetic bear bait, hog hunting lure, bear scent beads and hog attractant beads. Legal in all 50 states." />

    <!-- Canonical + Sitemap -->
    <link rel="canonical" href="{{ canonical_url }}" />
    <link rel="sitemap" type="application/xml" href="https://www.odinsinnovations.com/bear-hog-attractants/sitemap.xml" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{ canonical_url }}" />
    <meta property="og:title" content="Bear & Hog Attractants — Synthetic Scent Beads That Last 30+ Days" />
    <meta property="og:description" content="100% synthetic bear attractant and feral hog attractant beads with 30+ day release. Weatherproof, biodegradable, legal everywhere." />
    <meta property="og:image" content="/bear-hog-attractants/images/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="{{ canonical_url }}" />
    <meta property="twitter:title" content="Bear & Hog Attractants" />
    <meta property="twitter:description" content="" />
    <meta property="twitter:image" content="/bear-hog-attractants/images/og-image.png" />

    <!-- SEO Meta Tags -->
    <meta name="keywords" content="bear attractant, feral pig attractant, feral hog attractant, wild hog scent, bear hunting scent, hog hunting lure, synthetic bear bait, bear scent beads, hog attractant beads, long lasting scent beads" />
    <meta name="author" content="Bear & Hog Attractants" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#664400" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://cdn.shopify.com/s/files/1/0555/8049/1971/files/Odins_favicon.png?v=1618500553" />

    <!-- Fonts -->
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Agency+FB:wght@400;700&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-XXXXXXXXXX', { page_path: window.location.pathname });
    </script>

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "name": "Bear & Hog Attractants",
          "url": "{{ canonical_url }}",
          "description": "Bear attractant and feral hog attractant beads engineered for consistent, weatherproof results.",
          "publisher": {
            "@type": "Organization",
            "name": "Bear & Hog Attractants",
            "url": "{{ canonical_url }}"
          }
        },
        {
          "@type": "BreadcrumbList",
          "itemListElement": [
            { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://www.odinsinnovations.com" },
            { "@type": "ListItem", "position": 2, "name": "Bear & Hog Attractants", "item": "{{ canonical_url }}" }
          ]
        },
        {
          "@type": "Organization",
          "name": "Odin's Innovations",
          "url": "{{ canonical_url }}",
          "logo": "https://cdn.shopify.com/s/files/1/0555/8049/1971/files/logo_f2bf23b3-0442-4946-90cd-51755447e2d8.png",
          "contactPoint": {
            "@type": "ContactPoint",
            "telephone": "316-393-0440",
            "contactType": "customer service",
            "email": "support@odinsscents.com"
          }
        },
        { "@type": "FAQPage", "mainEntity": [] }
      ]
    }
    </script>

    <!-- Mobile-Optimized Meta Tags -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Bear & Hog Attractants" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Your built CSS + JS - Filenames must match uploaded assets -->
    {{ 'index.css' | asset_url | stylesheet_tag }}
    <script type="module" src="{{ 'index.js' | asset_url }}"></script>
  </head>
  <body>
    <div id="root"></div>

    {{ content_for_footer }}
  </body>
</html>
