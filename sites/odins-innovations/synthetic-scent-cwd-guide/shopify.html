{% layout none %}

<!DOCTYPE html>
<html lang="en">
  <head>
    {{ content_for_header }}

    <!-- Base path so the React app finds images in Assets -->
    <base href="https://www.odinsinnovations.com/" />

    <meta charset="UTF-8" />
    <title>Synthetic Deer Scent vs Natural Urine | CWD Regulations by State | Odin's Innovations</title>

    <!-- Canonical + Sitemap -->

    <link rel="sitemap" type="application/xml" href="https://www.odinsinnovations.com/synthetic-scent-cwd-guide/sitemap.xml" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{ canonical_url }}" />
    <meta property="og:title" content="Synthetic Deer Scent and CWD — Legal Everywhere" />
    <meta property="og:description" content="Compliant synthetic attractants engineered for 30+ days of weather-resistant performance with zero biological risk." />
    <meta property="og:image" content="./og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="{{ canonical_url }}" />
    <meta property="twitter:title" content="Synthetic Deer Scent and CWD — Legal Everywhere" />
    <meta property="twitter:description" content="" />
    <meta property="twitter:image" content="./og-image.png" />

    <!-- SEO Meta Tags -->

    <meta name="theme-color" content="#664400" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://cdn.shopify.com/s/files/1/0555/8049/1971/files/Odins_favicon.png?v=1618500553" />

    <!-- Fonts -->
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Agency+FB:wght@400;700&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-XXXXXXXXXX', { page_path: window.location.pathname });
    </script>

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "name": "CWD & Synthetic Scent Guide",
          "url": "{{ canonical_url }}",
          "description": "100% synthetic attractants engineered for consistent results without risk of regulatory compliance or disease.",
          "publisher": {
            "@type": "Organization",
            "name": "CWD & Synthetic Scent Guide",
            "url": "{{ canonical_url }}"
          }
        },
        {
          "@type": "BreadcrumbList",
          "itemListElement": [
            { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://www.odinsinnovations.com" },
            { "@type": "ListItem", "position": 2, "name": "CWD & Synthetic Scent Guide", "item": "{{ canonical_url }}" }
          ]
        },

          "@type": "Organization",
          "name": "Odin's Innovations",
          "url": "{{ canonical_url }}",
          "logo": "/logo.png",
          "contactPoint": {
            "@type": "ContactPoint",
            "telephone": "316-393-0440",
            "contactType": "customer service",
            "email": "paul@odinsinnovations.com"
          }
        },
        { "@type": "FAQPage", "mainEntity": [] }
      ]

    <!-- Mobile-Optimized Meta Tags -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CWD & Synthetic Scent Guide" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Your built CSS + JS - Filenames must match uploaded assets -->
    {{ 'index.css' | asset_url | stylesheet_tag }}
    <script type="module" src="{{ 'index.js' | asset_url }}"></script>
  </head>
  <body>
    <div id="root"></div>

    {{ content_for_footer }}
