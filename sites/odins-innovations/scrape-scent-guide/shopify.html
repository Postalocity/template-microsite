{% layout none %}

<!DOCTYPE html>
<html lang="en">
  <head>
    {{ content_for_header }}

    <!-- Base path so the React app finds images in Assets -->
    <base href="https://www.odinsinnovations.com/" />

    <meta charset="UTF-8" />
    <title>Best Mock Scrape Scent | Synthetic, 30-Day Release, Biodegradable | Odin's Innovations</title>

    <!-- Canonical + Sitemap -->

    <link rel="sitemap" type="application/xml" href="https://www.odinsinnovations.com/scrape-scent-guide/sitemap.xml" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{ canonical_url }}" />

    <meta property="og:description" content="Consistent, weatherproof synthetic attractants for deer mock scrapes. 30-day release beads + liquid blend." />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="{{ canonical_url }}" />
    <meta property="twitter:title" content="Mock Scrape Scent Beads" />
    <meta property="twitter:description" content="" />
    <meta property="twitter:image" content="https://cdn.shopify.com/s/files/1/0555/8049/1971/files/Product_Page_4_image.png?v=1777488699" />

    <!-- SEO Meta Tags -->
    <meta name="keywords" content="mock scrape scents, deer scrape scent, mock scrape scent, mock scrapes for whitetails, active scrape scent, synthetic scrape scent, synthetic scent beads, long lasting scent beads, best mock scrape lure, mock scrape tips, pre-rut scrape strategy, whitetail scrape attractant, scrape blend scent beads, deer scrape lure, synthetic deer scent, rain proof deer scent, biodegradable scent beads, CWD safe deer scent, legal deer attractant, 30 day deer scent, mock scrape licking branch, scent beads vs drippers, scent beads vs natural urine" />

    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#664400" />

    <!-- Fonts -->
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Agency+FB:wght@400;700&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-XXXXXXXXXX', { page_path: window.location.pathname });
    </script>

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "name": "Mock Scrape Scent Beads",
          "url": "{{ canonical_url }}",
          "description": "Synthetic attractants engineered for consistent, weatherproof results in mock scrapes.",
          "publisher": {
            "@type": "Organization",
            "name": "Mock Scrape Scent Beads",
            "url": "{{ canonical_url }}"
          }
        },
        {
          "@type": "BreadcrumbList",
          "itemListElement": [
            { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://www.odinsinnovations.com" },
            { "@type": "ListItem", "position": 2, "name": "Mock Scrape Scent Beads", "item": "{{ canonical_url }}" }
          ]
        },
        {
          "@type": "Organization",
          "name": "Odin's Innovations",
          "url": "{{ canonical_url }}",
          "logo": "/logo.png",
          "contactPoint": {
            "@type": "ContactPoint",
            "telephone": "316-393-0440",
            "contactType": "customer service",
            "email": "support@odinsscents.com"
          }
        },
        { "@type": "FAQPage", "mainEntity": [] }
      ]
    }

    <!-- Mobile-Optimized Meta Tags -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Mock Scrape Scent Beads" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Your built CSS + JS - Filenames must match uploaded assets -->
    {{ 'index.css' | asset_url | stylesheet_tag }}
    <script type="module" src="{{ 'index.js' | asset_url }}"></script>
  </head>
  <body>
    <div id="root"></div>

    {{ content_for_footer }}

</html>
