{% layout none %}

<!DOCTYPE html>
<html lang="en">
  <head>
    {{ content_for_header }}

    <!-- Base path so the React app finds images in Assets -->
    <base href="https://www.odinsinnovations.com/" />

    <meta charset="UTF-8" />
    <title>Best Deer Food Scent Attractants | Apple, Acorn, Peanut Butter | Odin's Innovations</title>
    <meta name="description" content="Odin's food scent attractants keep deer coming back for 30+ days. Apple, acorn, persimmon, peanut butter & more. Biodegradable, rain-proof, synthetic. Less cost, fewer field visits than corn." />

    <!-- Canonical + Sitemap -->
    <link rel="canonical" href="{{ canonical_url }}" />
    <link rel="sitemap" type="application/xml" href="https://www.odinsinnovations.com/pages/food-scent-deer-attractants/sitemap.xml" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{ canonical_url }}" />
    <meta property="og:title" content="Food Scent Attractants for Deer — 30+ Days Consistent Release" />
    <meta property="og:description" content="Synthetic apple, acorn, peanut butter, persimmon & more. Weatherproof 30+ day attraction. Lower cost and 80% fewer trips than corn. Legal in all 50 states." />
    <meta property="og:image" content="/food-scent-deer-attractants/images/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="{{ canonical_url }}" />
    <meta property="twitter:title" content="Food Scent Attractants" />
    <meta property="twitter:description" content="" />
    <meta property="twitter:image" content="/food-scent-deer-attractants/images/og-image.png" />

    <!-- SEO Meta Tags -->
    <meta name="keywords" content="food scent attractants, synthetic food scent beads, do deer like peanut butter, peanut butter deer attractant, apple scent for deer, acorn scent, acorn attractant for deer, persimmon deer attractant, deer molasses, long lasting scent beads, best attractants with trail cameras, legal bait alternatives" />
    <meta name="author" content="Food Scent Attractants" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#664400" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://cdn.shopify.com/s/files/1/0555/8049/1971/files/Odins_favicon.png?v=1618500553" />

    <!-- Fonts -->
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Agency+FB:wght@400;700&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-XXXXXXXXXX', { page_path: window.location.pathname });
    </script>

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "name": "Food Scent Attractants",
          "url": "{{ canonical_url }}",
          "description": "Synthetic scent beads that pull deer to your trail cameras and stand sites for over a month — no spoilage, no CWD risk, no feeder maintenance. 8 real food scents starting at $13.99.",
          "publisher": {
            "@type": "Organization",
            "name": "Food Scent Attractants",
            "url": "{{ canonical_url }}"
          }
        },
        {
          "@type": "BreadcrumbList",
          "itemListElement": [
            { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://www.odinsinnovations.com" },
            { "@type": "ListItem", "position": 2, "name": "Food Scent Attractants", "item": "{{ canonical_url }}" }
          ]
        },
        {
          "@type": "Organization",
          "name": "Odin's Innovations",
          "url": "{{ canonical_url }}",
          "logo": "/logo.png",
          "contactPoint": {
            "@type": "ContactPoint",
            "telephone": "316-393-0440",
            "contactType": "customer service",
            "email": "paul@odinsinnovations.com"
          }
        },
        { "@type": "FAQPage", "mainEntity": [] }
      ]
    }
    </script>

    <!-- Mobile-Optimized Meta Tags -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Food Scent Attractants" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Your built CSS + JS - Filenames must match uploaded assets -->
    {{ 'index.css' | asset_url | stylesheet_tag }}
    <script type="module" src="{{ 'index.js' | asset_url }}"></script>
  </head>
  <body>
    <div id="root"></div>

    {{ content_for_footer }}
  </body>
</html>
